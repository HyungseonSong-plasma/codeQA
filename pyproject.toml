[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codeqa"
version = "0.1.0"
description = "Evidence-based, language-independent code quality analysis"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["codeqa*"]

# Resources are referenced by logical ID; paths are repository-relative.
[tool.codeqa.resources]
repository_layout = "profiles/repository-layout.json"
ccg_schema = "contracts/ccg/graph-v0.1.schema.json"
adapter_capability_schema = "contracts/adapters/capability-v0.1.schema.json"
source_selection_schema = "contracts/adapters/source-selection-v0.1.schema.json"
python_adapter_capability = "profiles/python-adapter-capabilities-v0.1.json"
mechanical_profile = "profiles/mechanical-v0.1.json"
extraction_p3_profile = "profiles/extraction-p3-v0.1.json"
extraction_p3_report_schema = "contracts/qa/extraction-p3-v0.1.schema.json"
structural_p3_delta_schema = "contracts/qa/structural-p3-delta-v0.1.schema.json"
dependency_metrics_profile = "profiles/dependency-metrics-v0.1.json"
complexity_profile = "profiles/complexity-v0.1.json"
duplication_profile = "profiles/duplication-v0.1.json"
duplication_report_schema = "contracts/qa/duplication-report-v0.1.schema.json"
statement_similarity_profile = "profiles/statement-similarity-v0.2.json"
statement_similarity_report_schema = "contracts/qa/statement-similarity-v0.2.schema.json"
python_naming_safe_profile = "profiles/python-naming-safe-v0.1.json"
naming_report_schema = "contracts/qa/naming-report-v0.1.schema.json"
python_pinned_ancestor_profile = "profiles/python-pinned-ancestor-v0.1.json"
pinned_ancestor_report_schema = "contracts/qa/pinned-ancestor-v0.1.schema.json"
python_directional_fields_profile = "profiles/python-directional-fields-v0.1.json"
directional_fields_report_schema = "contracts/qa/directional-fields-v0.1.schema.json"
python_naming_glossary_profile = "profiles/python-naming-glossary-v0.1.json"
naming_glossary_report_schema = "contracts/qa/naming-glossary-v0.1.schema.json"
complexity_report_schema = "contracts/qa/complexity-report-v0.1.schema.json"
body_complexity_v02_schema = "contracts/qa/body-complexity-v0.2.schema.json"
qa_result_schema = "contracts/qa/result-v0.1.schema.json"
qa_delta_schema = "contracts/qa/delta-v0.1.schema.json"
metric_snapshot_v02_schema = "contracts/qa/metric-snapshot-v0.2.schema.json"
source_change_v02_schema = "contracts/qa/source-change-v0.2.schema.json"
qa_delta_v02_schema = "contracts/qa/delta-v0.2.schema.json"
