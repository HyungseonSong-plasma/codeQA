[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codeqa"
version = "0.1.0"
description = "Evidence-based, language-independent code quality analysis"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["codeqa*"]

# Resources are referenced by logical ID; paths are repository-relative.
[tool.codeqa.resources]
repository_layout = "profiles/repository-layout.json"
ccg_schema = "contracts/ccg/graph-v0.1.schema.json"
adapter_capability_schema = "contracts/adapters/capability-v0.1.schema.json"
source_selection_schema = "contracts/adapters/source-selection-v0.1.schema.json"
python_adapter_capability = "profiles/python-adapter-capabilities-v0.1.json"
mechanical_profile = "profiles/mechanical-v0.1.json"
dependency_metrics_profile = "profiles/dependency-metrics-v0.1.json"
qa_result_schema = "contracts/qa/result-v0.1.schema.json"
qa_delta_schema = "contracts/qa/delta-v0.1.schema.json"
