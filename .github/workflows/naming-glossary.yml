name: Project naming glossary conformance

on:
  pull_request:
    paths:
      - 'src/codeqa/core/naming_glossary.py'
      - 'src/codeqa/evaluation/naming_glossary.py'
      - 'profiles/python-naming-glossary-v0.1.json'
      - 'contracts/qa/naming-glossary-v0.1.schema.json'
      - 'tests/test_naming_glossary.py'
      - 'docs/naming-glossary.md'
      - 'pyproject.toml'
      - '.github/workflows/naming-glossary.yml'
  push:
    branches: [main]
    paths:
      - 'src/codeqa/core/naming_glossary.py'
      - 'src/codeqa/evaluation/naming_glossary.py'
      - 'profiles/python-naming-glossary-v0.1.json'
      - 'contracts/qa/naming-glossary-v0.1.schema.json'
      - 'tests/test_naming_glossary.py'
      - 'docs/naming-glossary.md'
      - 'pyproject.toml'
      - '.github/workflows/naming-glossary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glossary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -e .
      - run: python3 -m unittest discover -s tests -p test_naming_glossary.py -v
