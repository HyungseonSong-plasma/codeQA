name: Repository Layout Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    name: layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision and policy baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install codeQA with CCG runtime validation dependency
        run: python3 -m pip install --disable-pip-version-check -e .
      - name: Verify CCG Core, contracts, layout and frozen policy tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Evaluate directory roles and versioned semantic architecture evidence
        run: python3 .github/scripts/semantic_layout_audit.py
      - name: Upload semantic directory-role evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-layout-audit
          path: semantic-layout-audit.json
          if-no-files-found: warn
      - name: Compare frozen policy to trusted base commit
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CODEQA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m codeqa.governance.frozen_policy \
            --base-sha "$CODEQA_BASE_SHA" \
            --resource-id repository_layout
