name: Repository Layout Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    name: layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision and policy baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify layout evaluator, live layout and frozen policy tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compare frozen policy to trusted base commit
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CODEQA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          PYTHONPATH=src python3 -m codeqa.evaluation.frozen_policy \
            --base-sha "$CODEQA_BASE_SHA" \
            --resource-id repository_layout
