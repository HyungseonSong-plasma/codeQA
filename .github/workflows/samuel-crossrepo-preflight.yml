name: Samuel codeQA Read-only Handoff Preflight
run-name: samuel-codeqa-handoff:source-${{ inputs.source_run_id || github.run_id }}

on:
  pull_request:
    paths:
      - '.github/workflows/samuel-crossrepo-preflight.yml'
      - 'src/codeqa/governance/samuel_target_preflight.py'
      - 'tests/test_samuel_target_preflight.py'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Samuel originating GitHub workflow run ID
        type: string
        required: true
      controller_sha:
        description: Exact source Controller main commit (40 hex)
        type: string
        required: true
      expected_target_sha:
        description: Previously observed codeQA main commit (40 hex)
        type: string
        required: true
      work_id:
        description: Repository-scoped approved task identity
        type: string
        required: true

permissions:
  contents: read
  issues: read

concurrency:
  group: samuel-codeqa-readonly-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install codeQA
        run: python -m pip install --disable-pip-version-check -e .
      - name: Enforce contract negative controls
        run: python -m unittest discover -s tests -p 'test_samuel_target_preflight.py' -v
      - name: Fetch independently observed GitHub source/target Issues and exact branch identities
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DISPATCH_CONTROLLER_SHA: ${{ inputs.controller_sha }}
          DISPATCH_EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          DISPATCH_WORK_ID: ${{ inputs.work_id }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "HyungseonSong-plasma/codeQA"
          gh api "repos/HyungseonSong-plasma/chatgpt-operation/issues/220" > source-issue.json
          gh api "repos/HyungseonSong-plasma/codeQA/issues/92" > target-issue.json
          source_sha="$(gh api "repos/HyungseonSong-plasma/chatgpt-operation/commits/main" --jq '.sha')"
          target_sha="$(gh api "repos/HyungseonSong-plasma/codeQA/commits/main" --jq '.sha')"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            source_run_id="$DISPATCH_SOURCE_RUN_ID"
            gh api "repos/HyungseonSong-plasma/chatgpt-operation/actions/runs/$source_run_id" > source-run.json
            SOURCE_RUN_PATH=source-run.json PYTHONPATH=src python - <<'PY'
          import json, os
          from codeqa.governance.samuel_target_preflight import verify_origin_workflow
          run=json.load(open(os.environ["SOURCE_RUN_PATH"]))
          verify_origin_workflow(
              run,
              source_run_id=os.environ["DISPATCH_SOURCE_RUN_ID"],
              controller_sha=os.environ["DISPATCH_CONTROLLER_SHA"],
          )
          print("SAMUEL_SOURCE_RUN=VERIFIED")
          PY
            test "$DISPATCH_CONTROLLER_SHA" = "$source_sha"
            controller_sha="$DISPATCH_CONTROLLER_SHA"
            expected_target_sha="$DISPATCH_EXPECTED_TARGET_SHA"
            work_id="$DISPATCH_WORK_ID"
          else
            source_run_id="$RUN_ID"
            # PR-origin preflight checks live read-only handoff but is NOT
            # evidence of a Samuel-origin cross-repository dispatch.
            controller_sha="$source_sha"
            expected_target_sha="$target_sha"
            work_id="github:HyungseonSong-plasma/codeQA:issue:92"
          fi
          export controller_sha expected_target_sha target_sha work_id source_run_id
          PYTHONPATH=src python - <<'PY'
          import json, os
          from pathlib import Path
          from codeqa.governance.samuel_target_preflight import evaluate_handoff
          result = evaluate_handoff(
              source_issue=json.loads(Path("source-issue.json").read_text()),
              target_issue=json.loads(Path("target-issue.json").read_text()),
              source_repository="HyungseonSong-plasma/chatgpt-operation",
              target_repository=os.environ["GITHUB_REPOSITORY"],
              work_id=os.environ["work_id"],
              controller_sha=os.environ["controller_sha"],
              expected_target_sha=os.environ["expected_target_sha"],
              actual_target_sha=os.environ["target_sha"],
              actor=os.environ["ACTOR"],
              github_run_id=os.environ["RUN_ID"],
              source_run_id=os.environ["source_run_id"],
          )
          output = result.to_document()
          output["origin"] = (
              "CONTROLLER_DISPATCH_UNVERIFIED"
              if os.environ["EVENT"] == "pull_request"
              else "WORKFLOW_DISPATCH_ACTOR_ATTESTED"
          )
          Path("samuel-target-preflight-receipt.json").write_text(
              json.dumps(output, indent=2, sort_keys=True)+"\n"
          )
          print("SAMUEL_CODEQA_PREFLIGHT=" + result.status
                + " origin=" + output["origin"]
                + " mutations=0")
          PY
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samuel-codeqa-readonly-preflight-${{ github.run_id }}
          path: samuel-target-preflight-receipt.json
          if-no-files-found: ignore
          retention-days: 30
