name: Pinned PhysicsApp Compiler Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/physicsapp-compiler-evidence.yml'
      - 'docs/workflow-catalog-v0.1.json'
      - 'docs/workflow-provenance-v0.1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/physicsapp-compiler-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-physicsapp-compile-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact historical PhysicsApp source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: HyungseonSong-plasma/moose-test-repo
          ref: 1977ad5559e5aa7a1c8d04c83735c15e007130d5
          path: app
          persist-credentials: false
      - name: Verify source revision and dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "1977ad5559e5aa7a1c8d04c83735c15e007130d5"
          source app/physics_app/dependencies.lock
          test "$MOOSE" = "9f388366ccf38b9c34542ec5561198249fde0ac9"
          test "$CRANE" = "ba26970cf419dcac563a20ed7079d445bc6341c3"
          test "$SQUIRREL" = "16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1"
          test "$ZAPDOS" = "9eceffbc46048c3760bbfa9a7f1ca681ae35af1d"
          test "$PHYSICS_BUILD_BASE" = "ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008"
          mkdir -p d3-evidence
          printf 'application_commit=%s\nMOOSE=%s\nCRANE=%s\nSQUIRREL=%s\nZAPDOS=%s\nbuild_base=%s\n' \
            "$(git -C app rev-parse HEAD)" "$MOOSE" "$CRANE" "$SQUIRREL" "$ZAPDOS" "$PHYSICS_BUILD_BASE" \
            > d3-evidence/source-lock.txt
          echo D3_SOURCE_DEPENDENCY_IDENTITY_PASS
      - name: Prepare adequate Docker runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          df -h /
      - name: Pull immutable build base and validate dependency labels
        shell: bash
        run: |
          set -euo pipefail
          source app/physics_app/dependencies.lock
          docker pull "$PHYSICS_BUILD_BASE"
          for pair in "moose:$MOOSE" "crane:$CRANE" "squirrel:$SQUIRREL" "zapdos:$ZAPDOS"; do
            name="${pair%%:*}"
            expected="${pair#*:}"
            actual="$(docker image inspect "$PHYSICS_BUILD_BASE" --format "{{ index .Config.Labels \"io.physics.${name}.sha\" }}")"
            test "$actual" = "$expected"
          done
          echo D3_PINNED_DEPENDENCY_LABELS_PASS
      - name: Compile and link real PhysicsApp, then check input
        shell: bash
        run: |
          set -euo pipefail
          source app/physics_app/dependencies.lock
          mkdir -p d3-evidence
          docker run --rm \
            --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace/physics_app \
            -v "$PWD/app:/workspace" \
            "$PHYSICS_BUILD_BASE" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              test "$(git -C /workspace rev-parse HEAD)" = "1977ad5559e5aa7a1c8d04c83735c15e007130d5"
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              test ! -e physics-opt
              echo D3_COMPILER_VERSION_OBSERVED_NOT_INDEPENDENTLY_PINNED
              command -v c++
              c++ --version
              make -j2
              test -x physics-opt
              ./physics-opt --check-input -i ci/smoke.i
              echo D3_PHYSICSAPP_COMPILE_LINK_CHECK_INPUT_PASS
            ' 2>&1 | tee d3-evidence/compile-link.log
          echo "D3_PHYSICSAPP_COMPILE_LINK_CHECK_INPUT_PASS" > d3-evidence/result.txt
          test -s d3-evidence/source-lock.txt
          test -s d3-evidence/compile-link.log
          test "$(cat d3-evidence/result.txt)" = "D3_PHYSICSAPP_COMPILE_LINK_CHECK_INPUT_PASS"
      - name: Upload bounded non-ABI compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-physicsapp-d3-compile-link
          if-no-files-found: error
          retention-days: 14
          path: |
            d3-evidence/source-lock.txt
            d3-evidence/result.txt
            d3-evidence/compile-link.log
