name: Python Package Build and Isolated Smoke

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/codeqa/**'
      - 'profiles/**'
      - 'contracts/**'
      - '.github/scripts/build_resource_bundle.py'
      - '.github/scripts/package_smoke.py'
      - '.github/scripts/package_negative_smoke.py'
      - '.github/scripts/package_typecheck_smoke.py'
      - 'fixtures/installed-consumer/**'
      - '.github/workflows/python-package.yml'
      - 'docs/python-package.md'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'src/codeqa/**'
      - 'profiles/**'
      - 'contracts/**'
      - '.github/scripts/build_resource_bundle.py'
      - '.github/scripts/package_smoke.py'
      - '.github/scripts/package_negative_smoke.py'
      - '.github/scripts/package_typecheck_smoke.py'
      - 'fixtures/installed-consumer/**'
      - '.github/workflows/python-package.yml'
      - 'docs/python-package.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: wheel-sdist-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install distribution tools
        run: python -m pip install --disable-pip-version-check build wheel twine
      - name: Build wheel and sdist in isolated backend
        run: python -m build --wheel --sdist .
      - name: Check distributions and create separate registered resource bundle
        env:
          CODEQA_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m twine check dist/*.whl dist/*.tar.gz
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python .github/scripts/build_resource_bundle.py \
            --root . \
            --source-revision "$CODEQA_SOURCE_SHA" \
            --output "dist/codeqa-resource-bundle-${VERSION}.zip"
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          paths=sorted(p for p in Path("dist").iterdir()
                       if p.suffix in {".whl",".gz",".zip"})
          assert len(paths)==3, [p.name for p in paths]
          (Path("dist") / "SHA256SUMS").write_text(
              "".join(f"{sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
                      for p in paths), encoding="utf-8")
          PY
      - name: Install and smoke-test the isolated wheel
        env:
          CODEQA_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python -m venv "$RUNNER_TEMP/codeqa-wheel"
          "$RUNNER_TEMP/codeqa-wheel/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/codeqa-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/codeqa-wheel/bin/python" -I \
            "$GITHUB_WORKSPACE/.github/scripts/package_smoke.py" \
            --bundle "$GITHUB_WORKSPACE/dist/codeqa-resource-bundle-${VERSION}.zip" \
            --source-root "$GITHUB_WORKSPACE" \
            --source-revision "$CODEQA_SOURCE_SHA" --version "$VERSION"
      - name: Typecheck controlled external-to-checkout installed wheel consumer
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/codeqa-wheel/bin/python" -m pip install --disable-pip-version-check 'pyright==1.1.414'
          "$RUNNER_TEMP/codeqa-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/codeqa-wheel/bin/python" -I \
            "$GITHUB_WORKSPACE/.github/scripts/package_typecheck_smoke.py" \
            --pyright "$RUNNER_TEMP/codeqa-wheel/bin/pyright" \
            --venv "$RUNNER_TEMP/codeqa-wheel" \
            --positive "$GITHUB_WORKSPACE/fixtures/installed-consumer/valid.py" \
            --negative "$GITHUB_WORKSPACE/fixtures/installed-consumer/invalid.py" \
            --output "$GITHUB_WORKSPACE/dist/installed-consumer-pyright-${{ matrix.python-version }}.json"
      - name: Reject corrupted bundles using the isolated installed wheel
        env:
          CODEQA_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/codeqa-wheel/bin/python" -I \
            "$GITHUB_WORKSPACE/.github/scripts/package_negative_smoke.py" \
            --bundle "$GITHUB_WORKSPACE/dist/codeqa-resource-bundle-${VERSION}.zip" \
            --source-revision "$CODEQA_SOURCE_SHA" --version "$VERSION"
      - name: Install and smoke-test the isolated sdist
        env:
          CODEQA_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python -m venv "$RUNNER_TEMP/codeqa-sdist"
          "$RUNNER_TEMP/codeqa-sdist/bin/python" -m pip install --disable-pip-version-check dist/*.tar.gz
          "$RUNNER_TEMP/codeqa-sdist/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/codeqa-sdist/bin/python" -I \
            "$GITHUB_WORKSPACE/.github/scripts/package_smoke.py" \
            --bundle "$GITHUB_WORKSPACE/dist/codeqa-resource-bundle-${VERSION}.zip" \
            --source-root "$GITHUB_WORKSPACE" \
            --source-revision "$CODEQA_SOURCE_SHA" --version "$VERSION"
      - name: Upload candidate dist and SHA-256 checksums (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeqa-${{ matrix.python-version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 30

  optional-framework-evidence:
    name: pinned-pydantic-sqlalchemy-executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exactly pinned optional frameworks
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check 'pydantic==2.13.5' 'SQLAlchemy==2.0.50'
          python -m pip check
      - name: Require actually executed optional conformance tests
        run: |
          python - <<'PY'
          import importlib.metadata
          import unittest
          for name, exact in [('pydantic','2.13.5'),('SQLAlchemy','2.0.50')]:
              assert importlib.metadata.version(name) == exact
          tests=unittest.defaultTestLoader.discover(
              start_dir='tests', pattern='test_dto_orm_runtime_v02.py'
          )
          result=unittest.TextTestRunner(verbosity=2).run(tests)
          if not result.wasSuccessful() or result.skipped or result.testsRun < 5:
              raise SystemExit(f'PINNED_FRAMEWORKS=FAIL tests={result.testsRun} '
                               f'skipped={result.skipped!r}')
          print('PINNED_FRAMEWORKS=PASS tests=',result.testsRun)
          PY
