# One-shot, fail-closed branch cleanup via pinned Samuel branch-delete capability.
# Runs only when this file is first added/changed on protected main.
name: codeQA — Samuel exact-SHA merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codeqa-merged-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - branch: analysis/compare-refactor-snapshots
          - branch: analysis/moose-test-readonly-audit
          - branch: chore/reproducible-codeqa-self-audit
          - branch: feat/ccg-core-v01-model-validation
          - branch: feat/ccg-v01-graph-contract
          - branch: feat/conservative-cross-module-symbol-evidence
          - branch: feat/contextual-call-review-moose-audit
          - branch: feat/mechanical-evaluation-and-python-pipeline
          - branch: feat/python-adapter-v01-ccg-integration
          - branch: feat/responsibility-behavior-v01
          - branch: feat/semantic-architecture-ontology-v01
          - branch: feat/semantic-directory-role-policy
          - branch: feat/separate-quality-from-analysis-and-resolve-local-python-calls
          - branch: feat/shared-evidence-incremental-python-analysis
          - branch: feat/static-dependency-impact-v01
          - branch: fix/neutral-function-context-boundary
          - branch: refactor/codeqa-package-responsibility-boundaries
          - branch: refactor/generic-layout-evaluator-frozen-policy-guard
          - branch: refactor/resource-registry-policy-resolution
          - branch: refactor/self-audit-driven-quality-boundaries
          - branch: refactor/separate-git-io-and-installable-package
          - branch: chore/samuel-merged-branch-cleanup-20261023
    steps:
      - name: Verify exactly one merged PR and snapshot live branch SHA
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "HyungseonSong-plasma/codeQA"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$BRANCH"
          test "$BRANCH" != "main"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          # Only an exactly matching already-merged PR qualifies.  This also
          # validates the cleanup PR branch after this workflow reaches main.
          matching="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" --jq ".[] | select(.merged_at != null and .head.ref == \"$BRANCH\" and .head.sha == \"$sha\") | .number")"
          if [[ -z "$matching" || "$matching" == *$'\n'* ]]; then
            echo "HARD_STOP: no unique merged PR with exact branch HEAD for $BRANCH" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validated merged PR #$matching, branch=$BRANCH, head=$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete exact verified SHA using pinned Samuel capability
        uses: HyungseonSong-plasma/chatgpt-operation/.github/actions/branch-delete@9b335e3fbb9c5e8e323e382daeec56fa25336822
        with:
          repository: ${{ github.repository }}
          branch: ${{ matrix.branch }}
          expected-sha: ${{ steps.preflight.outputs.sha }}
          github-token: ${{ github.token }}
