name: Architecture Inventory B1 (exact HEAD)

on:
  pull_request:
    paths:
      - 'src/codeqa/evaluation/architecture/**'
      - 'contracts/qa/architecture-inventory-v0.1.schema.json'
      - 'tests/test_architecture_inventory_v01.py'
      - 'docs/architecture-inventory-v0.1.md'
      - '.github/scripts/architecture_inventory_audit.py'
      - '.github/workflows/architecture-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head (not synthetic merge commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Validate B1 source and negative tests
        run: python -m unittest discover -s tests -p 'test_architecture_inventory_v01.py' -v
      - name: Generate pinned inventory and validate JSON schema
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python .github/scripts/architecture_inventory_audit.py --output architecture-inventory.json
          python - <<'PY'
          import json
          import os
          from jsonschema import Draft202012Validator
          report = json.load(open("architecture-inventory.json", encoding="utf-8"))
          schema = json.load(open("contracts/qa/architecture-inventory-v0.1.schema.json", encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(report)
          assert report["source_identity"]["repository_commit_sha"] == os.environ["EXPECTED_HEAD"]
          assert report["coverage"]["tracked_total"] == (
              report["coverage"]["read"] + report["coverage"]["missing"]
              + report["coverage"]["excluded"] + report["coverage"]["failed"]
              + report["coverage"]["symlink_not_followed"]
          )
          assert report["coverage"]["parsed"] == 0
          PY
      - name: Upload exact-head inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-inventory-b1
          path: architecture-inventory.json
          if-no-files-found: error
