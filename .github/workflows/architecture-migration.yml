name: Architecture Migration B5 (exact HEAD)

on:
  pull_request:
    paths:
      - 'src/codeqa/evaluation/architecture/**'
      - 'contracts/qa/architecture-migration-v0.1.schema.json'
      - 'tests/test_architecture_migration_v01.py'
      - 'docs/architecture-migration-v0.1.md'
      - '.github/scripts/architecture_migration_audit.py'
      - '.github/workflows/architecture-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e .
      - name: Validate B5 adversarial and source identity tests
        run: python -m unittest discover -s tests -p 'test_architecture_migration_v01.py' -v
      - name: Generate exact-head B1 B2 B3 B4 B5 chain
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python .github/scripts/architecture_inventory_audit.py --output architecture-inventory.json
          python .github/scripts/architecture_metrics_audit.py --inventory architecture-inventory.json --output architecture-metrics.json
          python .github/scripts/architecture_opportunities_audit.py --inventory architecture-inventory.json --metrics architecture-metrics.json --output architecture-opportunities.json
          python .github/scripts/architecture_scenarios_audit.py --inventory architecture-inventory.json --metrics architecture-metrics.json --opportunities architecture-opportunities.json --output architecture-scenarios.json
          python .github/scripts/architecture_migration_audit.py --inventory architecture-inventory.json --scenarios architecture-scenarios.json --output architecture-migration.json
          python - <<'PY'
          import json
          import os
          report = json.load(open("architecture-migration.json", encoding="utf-8"))
          assert report["snapshot_sha"] == os.environ["EXPECTED_HEAD"]
          assert report["decision"] == "NOT_EVALUATED"
          assert report["evidence_status"] == "INCOMPLETE"
          assert all("EXTERNAL_CONSUMERS_UNOBSERVED" in c["unknowns"]
                     for c in report["candidates"])
          PY
      - name: Upload B5 migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-migration-b5
          path: architecture-migration.json
          if-no-files-found: error
