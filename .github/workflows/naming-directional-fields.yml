name: Directional DTO mapping conformance

on:
  pull_request:
    paths:
      - 'src/codeqa/core/naming_fields.py'
      - 'src/codeqa/adapters/python_naming_fields.py'
      - 'src/codeqa/evaluation/naming_fields.py'
      - 'tests/test_naming_fields.py'
      - 'profiles/python-directional-fields-v0.1.json'
      - 'contracts/qa/directional-fields-v0.1.schema.json'
      - 'fixtures/naming-dto/**'
      - 'docs/naming-directional-fields.md'
      - 'pyproject.toml'
      - '.github/workflows/naming-directional-fields.yml'
  push:
    branches: [main]
    paths:
      - 'src/codeqa/core/naming_fields.py'
      - 'src/codeqa/adapters/python_naming_fields.py'
      - 'src/codeqa/evaluation/naming_fields.py'
      - 'tests/test_naming_fields.py'
      - 'profiles/python-directional-fields-v0.1.json'
      - 'contracts/qa/directional-fields-v0.1.schema.json'
      - 'fixtures/naming-dto/**'
      - 'docs/naming-directional-fields.md'
      - 'pyproject.toml'
      - '.github/workflows/naming-directional-fields.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mapping:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -e .
      - run: python3 -m unittest discover -s tests -p test_naming_fields.py -v
