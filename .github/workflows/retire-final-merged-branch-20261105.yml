# One-shot, owner-authorized retirement of merged README PR #281 and this maintenance PR head.
# Runs only after this workflow's reviewed change is merged to main.
# Both deletions use pinned Samuel exact-SHA guarded action and live readback.
name: Retire merged README and cleanup branch heads (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-final-merged-branch-20261105.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  retire:
    if: github.repository == 'HyungseonSong-plasma/codeQA' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact merged revision
        uses: actions/checkout@v4

      - name: Verify merged README PR and cleanup PR, exact SHAs and empty request
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import quote

          repo = "HyungseonSong-plasma/codeQA"
          previous_branch = "docs/refresh-all-readmes-samuel-v01-20261105"
          this_branch = "chore/retire-readme-refresh-branch-20261105"
          previous_head = "ef82d78c8fb7feb11e6de5d9418219583418225c"
          previous_merge = "ecf268bc4fff4c503580e595ef1737154592199d"
          main_sha = os.environ["GITHUB_SHA"]

          if os.environ["GITHUB_REPOSITORY"] != repo or os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("CLEANUP_REPOSITORY_OR_REF_MISMATCH")
          git_head = subprocess.run(["git", "rev-parse", "HEAD"],
                                    check=True, text=True, capture_output=True).stdout.strip()
          if git_head != main_sha:
              raise SystemExit("CLEANUP_CHECKOUT_SHA_MISMATCH")
          if json.loads(Path(".github/requests/branch-delete-request.json").read_text()) != {"targets": []}:
              raise SystemExit("CLEANUP_REQUEST_NOT_EMPTY")

          def gh(path):
              result = subprocess.run(
                  ["gh", "api", "repos/" + repo + "/" + path],
                  check=True, capture_output=True, text=True, timeout=30,
              )
              return json.loads(result.stdout)

          def validate_pr(pr, branch, *, expected_sha=None, merge_sha=None):
              head = pr.get("head") or {}
              if (pr.get("merged_at") is None
                  or pr.get("state") != "closed"
                  or pr.get("base", {}).get("ref") != "main"
                  or head.get("ref") != branch
                  or (head.get("repo") or {}).get("full_name") != repo):
                  raise SystemExit("CLEANUP_PR_IDENTITY_MISMATCH")
              if merge_sha is not None and pr.get("merge_commit_sha") != merge_sha:
                  raise SystemExit("CLEANUP_MERGE_SHA_MISMATCH")
              sha = head.get("sha")
              if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit("CLEANUP_HEAD_SHA_INVALID")
              if expected_sha is not None and sha != expected_sha:
                  raise SystemExit("CLEANUP_PR_HEAD_CHANGED")
              if sha == main_sha:
                  raise SystemExit("CLEANUP_DEFAULT_BRANCH_TARGET")
              open_heads = gh("pulls?state=open&head=" +
                              quote("HyungseonSong-plasma:" + branch, safe="") + "&per_page=100")
              if open_heads:
                  raise SystemExit("CLEANUP_OPEN_PR_PROTECTED")
              live = gh("git/ref/heads/" + quote(branch, safe="/"))
              if live.get("object", {}).get("sha") != sha:
                  raise SystemExit("CLEANUP_LIVE_BRANCH_SHA_MISMATCH")
              return sha

          previous = gh("pulls/281")
          sha281 = validate_pr(previous, previous_branch,
                              expected_sha=previous_head, merge_sha=previous_merge)
          candidates = gh("pulls?state=closed&head=" +
                          quote("HyungseonSong-plasma:" + this_branch, safe="") + "&per_page=100")
          current = [pr for pr in candidates if pr.get("merge_commit_sha") == main_sha]
          if len(current) != 1:
              raise SystemExit("CLEANUP_CURRENT_MERGED_PR_NOT_UNIQUE")
          sha_current = validate_pr(current[0], this_branch, merge_sha=main_sha)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("prior_sha=" + sha281 + "\n")
              output.write("current_sha=" + sha_current + "\n")
          print("CLEANUP_EXACT_HEADS_VERIFIED", sha281, sha_current)
          PY

      - name: Retire merged README refresh branch
        uses: HyungseonSong-plasma/chatgpt-operation/.github/actions/branch-delete@b088fdbe86e72f0ca6af79bb70bf6a5100c4a4c3
        with:
          repository: HyungseonSong-plasma/codeQA
          branch: docs/refresh-all-readmes-samuel-v01-20261105
          expected-sha: ${{ steps.evidence.outputs.prior_sha }}
          github-token: ${{ github.token }}

      - name: Retire current merged maintenance branch
        uses: HyungseonSong-plasma/chatgpt-operation/.github/actions/branch-delete@b088fdbe86e72f0ca6af79bb70bf6a5100c4a4c3
        with:
          repository: HyungseonSong-plasma/codeQA
          branch: chore/retire-readme-refresh-branch-20261105
          expected-sha: ${{ steps.evidence.outputs.current_sha }}
          github-token: ${{ github.token }}
