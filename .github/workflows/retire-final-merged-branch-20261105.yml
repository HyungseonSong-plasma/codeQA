# One-shot cleanup of the final redundant, already-merged codeQA branch.
# Preserves Git history and uses the same pinned SHA-guarded Samuel action.
name: Retire final merged cleanup branch (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-final-merged-branch-20261105.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  retire:
    if: github.repository == 'HyungseonSong-plasma/codeQA' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact merged PR and current branch head
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: cleanup/merged-branches-final-20261105
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > "$RUNNER_TEMP/associated-prs.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          repo = "HyungseonSong-plasma/codeQA"
          branch = "cleanup/merged-branches-final-20261105"
          main_sha = os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          records = json.loads((Path(os.environ["RUNNER_TEMP"]) / "associated-prs.json").read_text())
          matches = [item for item in records
                     if item.get("merged_at") is not None
                     and item.get("merge_commit_sha") == main_sha
                     and item.get("head", {}).get("ref") == branch
                     and item.get("head", {}).get("repo", {}).get("full_name") == repo
                     and item.get("base", {}).get("ref") == "main"]
          if len(matches) != 1:
              raise SystemExit("FINAL_REF_RETIREMENT_MERGED_PR_IDENTITY_NOT_ATTESTED")
          head = matches[0]["head"]["sha"]
          if not isinstance(head, str) or not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("FINAL_REF_RETIREMENT_HEAD_SHA_INVALID")
          response = subprocess.run(
              ["gh", "api", f"repos/{repo}/git/ref/heads/{branch}"],
              capture_output=True, text=True, check=True, timeout=30)
          live = json.loads(response.stdout)
          if live.get("object", {}).get("sha") != head or head == main_sha:
              raise SystemExit("FINAL_REF_RETIREMENT_LIVE_SHA_CHANGED")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"expected_sha={head}\n")
          print("FINAL_REF_RETIREMENT_EXACT_PR_HEAD_VERIFIED", head)
          PY

      - name: Retire branch using pinned Samuel exact-SHA guard
        uses: HyungseonSong-plasma/chatgpt-operation/.github/actions/branch-delete@7b5b31e143474f4859fb6c85fb4a27afbad4eed3
        with:
          repository: HyungseonSong-plasma/codeQA
          branch: cleanup/merged-branches-final-20261105
          expected-sha: ${{ steps.evidence.outputs.expected_sha }}
          github-token: ${{ github.token }}
