name: Pinned Rust Parser Source Evidence

on:
  pull_request:
    paths:
      - 'src/codeqa/adapters/rust_parser_evidence.py'
      - 'tests/test_rust_parser_evidence.py'
      - 'fixtures/rust/**'
      - 'docs/rust-parser-evidence-v0.1.md'
      - '.github/workflows/rust-parser-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'src/codeqa/adapters/rust_parser_evidence.py'
      - 'tests/test_rust_parser_evidence.py'
      - 'fixtures/rust/**'
      - 'docs/rust-parser-evidence-v0.1.md'
      - '.github/workflows/rust-parser-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-rust-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout codeQA exact source
        uses: actions/checkout@v4
        with:
          path: codeqa
          persist-credentials: false
      - name: Checkout independently pinned Rust source
        uses: actions/checkout@v4
        with:
          repository: HyungseonSong-plasma/sol-adapter-moose
          ref: ce40af4ffda17feaef99f4de328c9a37b6019553
          path: rust-source
          persist-credentials: false
      - name: Assert exact source SHA and complete fixture byte identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rust-source rev-parse HEAD)" = "ce40af4ffda17feaef99f4de328c9a37b6019553"
          for name in lib main ir; do
            cmp "rust-source/src/$name.rs" "codeqa/fixtures/rust/sol-adapter-moose/src/$name.rs.txt"
          done
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned optional grammar (not default codeQA dependency)
        run: |
          python -m pip install --disable-pip-version-check -e ./codeqa
          python -m pip install --disable-pip-version-check 'tree-sitter==0.25.2' 'tree-sitter-rust==0.24.0'
          python -m pip check
      - name: Require real parser tests with zero skips
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              start_dir="codeqa/tests", pattern="test_rust_parser_evidence.py"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun < 7:
              raise SystemExit(f"RUST_PARSER=FAIL tests={result.testsRun} skipped={result.skipped}")
          print("RUST_PARSER=PASS tests=", result.testsRun)
          PY
      - name: Produce exact-source parser evidence (not trait or ABI proof)
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from codeqa.adapters.rust_parser_evidence import parse_rust_syntax
          data = Path("codeqa/fixtures/rust/sol-adapter-moose/src/lib.rs.txt").read_bytes()
          report = parse_rust_syntax(
              data, source_repository="HyungseonSong-plasma/sol-adapter-moose",
              source_revision="ce40af4ffda17feaef99f4de328c9a37b6019553",
              source_path="src/lib.rs", expected_source_sha256=sha256(data).hexdigest(),
          )
          Path("rust-parser-evidence.json").write_text(report.canonical_json() + "\n")
          assert report.declarations and "TRAIT_IMPL_RESOLUTION_NOT_EVALUATED" in report.unknowns
          PY
      - name: Upload parser-only witness
        uses: actions/upload-artifact@v4
        with:
          name: pinned-rust-parser-syntax
          path: rust-parser-evidence.json
          if-no-files-found: error
          retention-days: 30
