name: Naming v0.3 precedence draft conformance

on:
  pull_request:
    paths:
      - 'src/codeqa/core/naming_policy_precedence_v03.py'
      - 'tests/test_naming_policy_precedence_v03.py'
      - 'docs/naming-policy-precedence-v03-draft.md'
      - '.github/workflows/naming-policy-precedence-v03.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'src/codeqa/core/naming_policy_precedence_v03.py'
      - 'tests/test_naming_policy_precedence_v03.py'
      - 'docs/naming-policy-precedence-v03-draft.md'
      - '.github/workflows/naming-policy-precedence-v03.yml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  naming-precedence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # pinned historical source SHA for governance regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pinned test dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run adversarial precedence tests and existing governance tests
        run: |
          python -m unittest discover -s tests -p 'test_naming_policy_precedence_v03.py' -v
          python -m unittest discover -s tests -p 'test_naming_glossary_governance_v02.py' -v
          python -m unittest discover -s tests -p 'test_naming_governance_source_v02.py' -v
