      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  naming-precedence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # pinned historical source SHA for governance regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pinned test dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run adversarial precedence tests and existing governance tests
        env:
          CODEQA_NAMING_PINNED_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest discover -s tests -p 'test_naming_batch1_contract_v03.py' -v
          python -m unittest discover -s tests -p 'test_naming_field_classification_v03.py' -v
          python -m unittest discover -s tests -p 'test_naming_field_evidence_v03.py' -v
          python -m unittest discover -s tests -p 'test_naming_rule_inventory_v03.py' -v
          python -m unittest discover -s tests -p 'test_naming_semantic_candidate_v04.py' -v
          python -m unittest discover -s tests -p 'test_naming_scope_discovery_v04.py' -v
          python -m unittest discover -s tests -p 'test_naming_node_id_role_evidence_v04.py' -v
          python -m unittest discover -s tests -p 'test_naming_import_scope_gate_v04.py' -v
          python -m unittest discover -s tests -p 'test_naming_internal_import_census_v04.py' -v
          python -m unittest discover -s tests -p 'test_naming_snapshot_coverage_v03.py' -v
          python -m unittest discover -s tests -p 'test_naming_review_worklist_v03.py' -v
          python -m unittest discover -s tests -p 'test_naming_policy_precedence_v03.py' -v
          python -m unittest discover -s tests -p 'test_naming_glossary_governance_v02.py' -v
          python -m unittest discover -s tests -p 'test_naming_governance_source_v02.py' -v
